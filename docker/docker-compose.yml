services:
  dev:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    volumes:
      - ..:/workspace
      - stack-root:/root/.stack
    working_dir: /workspace
    ports:
      - "${PORT:-8080}:${PORT:-8080}"
    environment:
      - LANG=C.UTF-8
      - LC_ALL=C.UTF-8

volumes:
  stack-root:
