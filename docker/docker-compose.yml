services:
  dev:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    volumes:
      - ..:/workspace
      - stack-root:/root/.stack
      - ghc-wasm-cabal:/root/.ghc-wasm/.cabal
    working_dir: /workspace
    ports:
      - "${PORT:-8080}:${PORT:-8080}"
    environment:
      - LANG=C.UTF-8
      - LC_ALL=C.UTF-8
      - STACK_WORK=.stack-work-docker

volumes:
  stack-root:
  ghc-wasm-cabal:
